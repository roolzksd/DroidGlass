<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>DroidGlass hero</title>
<!-- The README banner is a screenshot of this page (Chrome, 1280x640, DPR 2). Every glass shape is the real engine. -->
<link rel="stylesheet" href="../assets/liquid-glass.css">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: #0A0E1F; }
  .stage { position: relative; width: 1280px; height: 640px; overflow: hidden; font-family: 'Inter Display', Inter, system-ui, sans-serif; }
  .bg { position: absolute; inset: 0;
    background:
      radial-gradient(420px 360px at 78% 22%, #FF3D8B 0%, rgb(255 61 139 / 0) 70%),
      radial-gradient(460px 380px at 96% 86%, #FF9A3C 0%, rgb(255 154 60 / 0) 70%),
      radial-gradient(520px 420px at 58% 92%, #19C3FF 0%, rgb(25 195 255 / 0) 70%),
      radial-gradient(520px 420px at 52% 6%, #7B5CFF 0%, rgb(123 92 255 / 0) 72%),
      radial-gradient(560px 520px at 6% 100%, #2B3BFF 0%, rgb(43 59 255 / 0) 72%),
      #0A0E1F; }
  .stripes { position: absolute; left: 600px; top: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(115deg, rgb(255 255 255 / .16) 0 2px, transparent 2px 22px);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 22%); mask-image: linear-gradient(90deg, transparent, #000 22%); }
  .dots { position: absolute; left: 0; top: 0; width: 640px; height: 640px;
    background: radial-gradient(circle, rgb(255 255 255 / .10) 1.4px, transparent 1.6px) 0 0 / 26px 26px;
    -webkit-mask-image: radial-gradient(520px 420px at 20% 40%, #000, transparent 75%); mask-image: radial-gradient(520px 420px at 20% 40%, #000, transparent 75%); }
  .ring { position: absolute; border-radius: 50%; border: 3px solid rgb(255 255 255 / .55); }
  .copy { position: absolute; left: 76px; top: 150px; color: #fff; }
  .kicker { font: 600 20px/1 Inter, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: rgb(255 255 255 / .62); }
  h1 { margin: 22px 0 0; font-weight: 800; font-size: 118px; line-height: .92; letter-spacing: -.035em; }
  .sub { margin-top: 26px; font: 500 27px/1.3 Inter, sans-serif; color: rgb(255 255 255 / .78); max-width: 520px; }
  .glass { position: absolute; }
  .drops { position: absolute; inset: 0; }
  .pill { left: 76px; top: 486px; height: 64px; padding: 0 30px; display: flex; align-items: center; gap: 14px;
    font: 600 21px/1 Inter, sans-serif; color: #fff; white-space: nowrap; }
  .pill b { color: rgb(255 255 255 / .55); font-weight: 600; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="bg"></div>
  <div class="dots"></div>
  <div class="stripes"></div>
  <div class="ring" style="left: 1010px; top: 70px; width: 120px; height: 120px"></div>
  <div class="ring" style="left: 760px; top: 420px; width: 70px; height: 70px"></div>
  <div class="copy">
    <div class="kicker">Agent skill · Liquid Glass</div>
    <h1>DroidGlass</h1>
    <div class="sub">Real refraction, merging drops and stretchy glass for Android WebView, web, Compose and SwiftUI.</div>
  </div>
  <div class="glass pill" id="pill">Claude Code <b>·</b> Codex <b>·</b> Cursor <b>·</b> DeepSeek</div>
  <div class="drops" id="drops">
  <div class="glass" id="a" style="left: 802px; top: 112px; width: 236px; height: 236px"></div>
  <div class="glass" id="b" style="left: 978px; top: 314px; width: 150px; height: 150px"></div>
  <div class="glass" id="c" style="left: 872px; top: 384px; width: 104px; height: 104px"></div>
  <div class="glass" id="d" style="left: 1036px; top: 145px; width: 62px; height: 62px"></div>
  <div class="glass" id="e" style="left: 663px; top: 465px; width: 224px; height: 84px"></div>
  </div>
</div>
<script src="../assets/liquid-glass.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  LiquidGlass.attach($('pill'), { radius: 'capsule', blur: 3, refractionHeight: 18, refractionAmount: 30, depth: 0.6, surface: 'rgb(255 255 255 / .06)' });
  const g = LiquidGlass.group($('drops'), { merge: 8, thickness: 10, resolution: 1, refraction: 34, blur: 1.2, saturation: 1.35, rim: 0.2, glare: 0.95, specular: 1, shade: 0.06, shadow: 0.28, margin: 40 });
  for (const id of ['a', 'b', 'c', 'd', 'e']) g.add($(id), { radius: 'capsule' });
  window.__ready = new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(r, 300))));
</script>
</body>
</html>
